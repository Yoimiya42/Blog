name: Feature
description: Implement one independently verifiable requirement.
title: ""
labels:
  - enhancement
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement
      description: Use an existing FR ID. Update the PRD first if this is a new idea.
      placeholder: FR-BLOG-03
    validations:
      required: true

  - type: dropdown
    id: target-version
    attributes:
      label: Target version
      options:
        - v1
        - v1.5
        - v2
        - v2.5
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the user-visible outcome, not the implementation.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Write observable and testable conditions.
      placeholder: |
        - [ ] First verifiable result
        - [ ] Second verifiable result
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: State what this Issue intentionally does not include.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link relevant ADRs, dependencies, designs, or earlier Issues.
      placeholder: |
        Relevant ADR: docs/adr/0003-china-accessibility.md
        Blocked by: #123
