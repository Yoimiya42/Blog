name: Bug report
description: Report one reproducible defect.
title: ""
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observable problem in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include device, OS, browser, route, and deployment when relevant.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and context
      description: Add screenshots, logs, related FRs, or links. Remove secrets first.
